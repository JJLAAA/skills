---
tests:
  - name: "Filter posts within date range"
    input: "分析本周 Anthropic 博客"
    expected_behavior: |
      - Fetches https://www.anthropic.com/engineering
      - Calculates last Sunday to today date range
      - Filters posts by date
      - If no posts, outputs "本周暂无新文章发布" and exits

  - name: "Create tasks for each article"
    input: "分析本周 Anthropic 博客"
    expected_behavior: |
      - Uses TaskCreate for each filtered article
      - Task subjects include article titles
      - Tasks marked as in_progress before analysis

  - name: "Invoke web-tech-article-analyzer"
    input: "分析本周 Anthropic 博客"
    expected_behavior: |
      - Calls Skill tool with web-tech-article-analyzer
      - Passes article URL to the skill
      - Waits for completion before next article

  - name: "Generate output file"
    input: "分析本周 Anthropic 博客"
    expected_behavior: |
      - Creates anthropic-weekly-YYYY-MM-DD.md
      - Contains header with article count
      - Each article analysis is independent and complete
      - File saved in current working directory
---
